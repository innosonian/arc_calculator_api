# 검토 반영 2026-09-05: P13 테스트 루트 고정. 2026-09-28 결정 Q14=C 로 scripts/ 아래 보조 Lambda
# (config_manager_v2·hmac_authorizer)와 그 단위 테스트를 삭제해 scripts/ 에는 수집할 테스트가 없으므로
# tests/ 만 수집한다. 통합 시험 폴더는 scripts/validate_local_integration.py 로 따로 실행한다.
# 2026-09-28 X4-15: 고정 버전 botocore 가 서명 때마다 내는 datetime.utcnow() 폐기 예고 경고(전체 실행에서
# 7만여 건)만 숨긴다. 메시지·분류·botocore 모듈을 모두 좁게 지정했으므로 이 저장소 코드나 다른 패키지의
# 경고, 다른 botocore 경고는 그대로 보인다. -W error 로 실행하지 않는 한 시험 결과는 바뀌지 않는다.
[pytest]
testpaths = tests
filterwarnings =
    ignore:datetime\.datetime\.utcnow\(\) is deprecated:DeprecationWarning:botocore\.
